#민감 정보는 윈도우 시스템 환경변수에 등록
server:
  port: 8080
spring:
  application:
    name: DateManagerBackend
    #데이터베이스 연결 설정(드라이버/URL/접속 계정)
  datasource:
    driver-class-name: oracle.jdbc.OracleDriver
    url: jdbc:oracle:thin:@localhost:1521/XEPDB1
    username: ${ORACLE_USERNAME}
    password: ${ORACLE_PASSWORD}
  jpa:
    show-sql: true
    hibernate:
      # date_manager 스키마는 이미 oracle-setup.sql로 테이블이 만들어져 있어서(users, social_accounts 등)
      # create로 두면 실행할 때마다 기존 테이블이 삭제되고 새로 생성됨 -> 데이터 유실 위험.
      # update는 기존 테이블/데이터를 지우지 않고 없는 것만 추가하므로 안전하게 사용 가능.
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        format_sql: true

  #구글/카카오 소셜로그인(OAuth2 Client) 설정
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-authentication-method: client_secret_post
            scope:
              - profile_nickname
            client-name: Kakao
          naver:
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - name
              - email
            client-name: Naver
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            # 네이버는 실제 사용자 정보가 최상위가 아니라 response 안에 중첩되어 내려온다
            user-name-attribute: response
  data:
    web:
      pageable:
        one-indexed-parameters: true #pageable index에서 자동으로 1을 빼기위한 설정(예: ?page=3요청시 pagebale index는 2
        page-parameter: page #page 파라미터변경(기본값:page)

  #비밀번호 찾기(재설정) 메일 발송용 SMTP 설정 - PASS/문자 인증은 유료라 보류하고 Gmail 앱 비밀번호로
  #무료 발송하는 방식을 채택했다. username/password는 발송 전용 지메일 계정 + 앱 비밀번호.
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  #스웨거 UI URL 설정
  springdoc:
    swagger-ui:
      path: /swagger-ui.html #기본 주소인 /swagger-ui/index.html로 리다이렉트
  #게시글 페이지 사이즈 설정
  post:
    page-size: 4
  #AWS S3 버킷에 대한 IAM유저 인증관련 키 설정(키는 임의 키)
  cloud:
    aws:
      credentials:
        access-key: ${S3_ACCESS_KEY} # AWS에서 발급받은 Access Key
        secret-key: ${S3_SECRET_KEY} # AWS에서 발급받은 Secret Key
      region: ap-northeast-2 # 서울 리전 기준
      s3:
        bucket: datemanager-profile-images # 생성한 S3 버킷 이름 (팀원이 프로필 사진 업로드 기능에 이미 연동해서 쓰던 버킷)

  #JWT 토큰 비밀키 및 만료시간 설정(키는 임의명)
  #-비밀 키(JSON WEB TOKEN 해쉬 및 서명 확인에 사용)
  #-32자 이상(256bit) 대문자와 소문자,숫자,+,=,/만 허용
  jwt:
    secret-key: ${JWT_SECRET_KEY}
    expiration-ms: 3600000 #엑세스 토큰 유효시간(1시간)

#소셜로그인 성공/실패 후 리다이렉트할 프론트엔드 주소 (Date_manager_FrontEnd의 vite dev 서버 포트)
app:
  frontend-base-url: "http://localhost:4869"
  #관리자 페이지 접근 허용 계정 이메일 (role 체계 없이 이 이메일과 일치하는 로그인 유저만 관리자로 취급)
  admin-email: ${ADMIN_EMAIL}

#KOPIS(공연예술통합전산망) 공연 목록 API 인증키 - PlaceSyncService에서 사용
kopis:
  service-key: ${KOPIS_SERVICE_KEY}

#기상청 API 허브 인증키 - WeatherService에서 사용 (프론트엔드에는 노출하지 않음)
kma:
  auth-key: ${KMA_AUTH_KEY}

#한국관광공사 TourAPI(국문 관광정보서비스) 인증키 - TourApiSyncService에서 사용
tourapi:
  service-key: ${TOUR_API_SERVICE_KEY}

#토스페이먼츠 시크릿 키 - 구독(정기결제) 빌링키 발급/결제 승인 요청에 사용 (테스트 연동 시 test_sk_ 로 시작하는 테스트 키 사용)
toss:
  secret-key: ${TOSS_SECRET_KEY}

#네이버 지역 검색 API(NAVER API HUB) 인증키 - NaverPlaceSyncService에서 액티비티/문화시설 보강용으로 사용
#소셜로그인용 NAVER_CLIENT_ID/SECRET과는 별개의, NCP 콘솔에서 발급받은 검색 전용 애플리케이션 키
naver:
  search:
    client-id: ${NAVER_SEARCH_CLIENT_ID}
    client-secret: ${NAVER_SEARCH_CLIENT_SECRET}

#OpenAI Chat Completions API 인증키 - AiChatService에서 사용 (결제 전에는 호출 시 401/429 발생 가능)
openai:
  api-key: ${OPENAI_API_KEY}

#카카오 로컬 API(장소 검색) 인증키 - KakaoPlaceSyncService에서 사용
#소셜로그인용 KAKAO_CLIENT_ID/SECRET(OAuth)과는 별개의, 카카오 디벨로퍼스에서 발급받는 REST API 키
kakao:
  rest-api-key: ${KAKAO_REST_API_KEY}

#서울올림픽기념국민체육진흥공단 체육진흥투표권(스포츠toto,프로토) 발매대상 경기정보 API 인증키 - SportsSyncService에서 사용
sportstoto:
  service-key: ${SPORTS_API_SERVICE_KEY}

#서울 열린데이터광장 숙박업 인허가 CSV 경로 - LodgingCsvSyncService에서 사용. 실시간 API가 아니라
#수시로 갱신되는 파일 다운로드 방식이라(반복 호출 가능한 REST API 없음), .env로 매번 새 파일 경로를
#지정하지 않아도 되게 프로젝트 루트 기준 기본 경로를 둔다 - 새 CSV를 받으면 이 경로에 덮어쓰기만 하면 됨.
place:
  lodging-csv-path: ${LODGING_CSV_PATH:data/lodging_wgs84.csv}
